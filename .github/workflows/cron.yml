# 手動執行任何一個排程用 GitHub 的定時排程常漏跑 定時的都改由 Vercel Cron 呼叫
# 要有 GitHub Secrets 的 HUB_URL 與 CRON_SECRET 設定方式見 docs/secrets.md
name: cron

on:
  workflow_dispatch:
    inputs:
      task:
        description: "排程名稱，例如 starrail:stamina"
        required: true
        default: "starrail:stamina"

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 呼叫 /api/cron
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TASK: ${{ inputs.task }}
        run: |
          if [ -z "$HUB_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "尚未設定 HUB_URL／CRON_SECRET，略過"
            exit 0
          fi
          curl --fail-with-body -sS -m 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$HUB_URL/api/cron/$TASK"
